    <circle cx="365" cy="142" r="42" stroke="#7C3AED" stroke-width="3.5" stroke-dasharray="6 6" stroke-opacity="0.5" />
    <circle cx="365" cy="142" r="26" fill="url(#hl_beacon_disk_l)" stroke="#FFFFFF" stroke-width="7" />
